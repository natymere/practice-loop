<style>
  :root {
    --ink: #203029;
    --muted: #53645b;
    --paper: #f5f7f3;
    --white: #ffffff;
    --line: #d5ded5;
    --green: #28563d;
    --green-hover: #1c422d;
    --soft: #e8f0e7;
    --red: #94342a;
    --error-bg: #fff0ec;
    --radius: 14px;
    --space-1: 8px;
    --space-2: 16px;
    --space-3: 24px;
    --space-4: 32px;
    --space-5: 48px;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  button, input, select, textarea { font: inherit; }
  button, input, select, textarea, a { touch-action: manipulation; }
  button, .button {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    gap: var(--space-1);
    min-height: 46px;
    padding: 10px 16px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--white);
    color: var(--ink);
    font-weight: 600;
    line-height: 1.4;
    text-decoration: none;
    cursor: pointer;
  }
  button:hover, .button:hover { background: var(--soft); }
  button:disabled { opacity: .6; cursor: wait; }
  .primary { background: var(--green); border-color: var(--green); color: white; }
  .primary:hover { background: var(--green-hover); border-color: var(--green-hover); }
  .secondary { background: var(--white); }
  .quiet { border-color: transparent; background: transparent; color: var(--green); }
  a { color: var(--green); text-underline-offset: 4px; }
  :focus-visible { outline: 3px solid #3d7853; outline-offset: 3px; }
  [tabindex="-1"]:focus { outline: none; }
  h1, h2, h3, p { margin: 0; }
  h1 { font-size: clamp(30px, 4vw, 40px); line-height: 1.2; letter-spacing: -1.1px; font-weight: 700; }
  h2 { font-size: 21px; line-height: 1.35; letter-spacing: -.4px; }
  h3 { font-size: 18px; line-height: 1.4; }
  .muted, .meta, .hint, .optional, .unit, .footnote { color: var(--muted); }
  .meta, .hint, .optional, .unit, .footnote { font-size: 14px; }
  .optional, .unit { font-weight: 400; margin-left: 4px; }
  .eyebrow { color: var(--green); font-size: 14px; font-weight: 600; letter-spacing: .3px; }
  .site-header { background: var(--white); border-bottom: 1px solid var(--line); }
  .header-inner {
    max-width: 960px;
    margin: auto;
    padding: 24px 32px 0;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 20px 16px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 750; letter-spacing: -.5px; }
  .brand-mark { width: 13px; height: 13px; border: 3px solid var(--green); border-radius: 50%; }
  nav { display: flex; gap: 28px; }
  nav button { padding: 12px 0 15px; border: 0; border-bottom: 3px solid transparent; border-radius: 0; color: var(--muted); background: transparent; }
  nav button:hover { background: transparent; color: var(--green); }
  nav button[aria-current="page"] { border-color: var(--green); color: var(--green); }
  .settings-button { justify-self: end; font-size: 14px; }
  main { max-width: 960px; margin: auto; padding: var(--space-5) var(--space-4) 28px; }
  .page-heading { display: grid; gap: 10px; margin-bottom: var(--space-4); }
  .form-page { max-width: 680px; margin-inline: auto; }
  .panel, .question-card { border: 1px solid var(--line); border-radius: var(--radius); padding: var(--space-3); background: var(--white); }
  .session-summary { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: var(--radius); background: var(--white); padding: 24px 0; margin-bottom: var(--space-4); }
  .session-summary > div { display: flex; flex-direction: column; padding: 0 24px; border-right: 1px solid var(--line); }
  .session-summary > div:last-child { border: 0; }
  .session-summary strong { font-size: 26px; line-height: 1.4; letter-spacing: -.5px; }
  .session-summary span { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .section-heading { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 12px; min-height: 46px; }
  .question-list { display: grid; gap: 16px; }
  .question-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .question-title { min-width: 0; }
  .question-title h2 { overflow-wrap: anywhere; }
  .question-title .meta { margin-top: 6px; overflow-wrap: anywhere; }
  .badge { flex-shrink: 0; background: var(--soft); color: var(--green); border-radius: 20px; padding: 4px 10px; font-size: 14px; }
  .question-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 20px; }
  .push-right { margin-left: auto; }
  .review-panel { border-top: 1px solid var(--line); margin-top: 24px; padding-top: 24px; }
  .rating-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .rating-actions button { flex: 1 1 150px; }
  .notes-panel { border-top: 1px solid var(--line); margin-top: 20px; padding-top: 4px; }
  summary { cursor: pointer; color: var(--muted); font-size: 14px; font-weight: 600; min-height: 44px; padding-block: 10px; }
  summary:hover { color: var(--green); }
  .disclosure-body { padding-top: 12px; }
  .disclosure-body > p + p { margin-top: 12px; }
  .history-entry { white-space: pre-wrap; overflow-wrap: anywhere; border-top: 1px solid var(--line); margin-top: 12px; padding-top: 12px; }
  .history-entry p { margin-top: 4px; }
  .form-stack { display: grid; gap: 24px; }
  .field { min-width: 0; }
  label { display: block; font-weight: 600; }
  input, select, textarea { display: block; width: 100%; min-height: 48px; margin-top: 8px; padding: 11px 12px; color: var(--ink); border: 1px solid #aebdb1; border-radius: 8px; background: white; }
  input::placeholder, textarea::placeholder { color: #65766b; opacity: 1; }
  textarea { resize: vertical; min-height: 110px; font-weight: 400; }
  label input { font-weight: 400; }
  .hint { margin-top: 8px; line-height: 1.5; }
  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
  .short-field, .short-input { max-width: 200px; }
  .form-end { display: grid; justify-items: start; gap: 12px; padding-top: 8px; }
  .form-end .feedback { width: 100%; }
  .toolbar { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-bottom: 24px; }
  .toolbar > .field:first-child { grid-column: 1 / -1; }
  .toolbar input, .toolbar select { margin-top: 0; }
  .feedback { padding: 12px 16px; border-radius: 8px; background: var(--soft); color: var(--green); overflow-wrap: anywhere; }
  .feedback.error { background: var(--error-bg); color: var(--red); }
  .feedback button { margin: 8px 0 0 8px; }
  #toast { margin-bottom: 24px; }
  [data-card-feedback]:not([hidden]) { margin-top: 16px; }
  .empty { text-align: center; padding: 48px 24px; border: 1px dashed #b8c7b8; border-radius: var(--radius); }
  .empty h2 { margin-bottom: 10px; }
  .empty p { max-width: 460px; margin: 0 auto 20px; }
  .empty-mark { display: grid; place-items: center; width: 44px; height: 44px; margin: 0 auto 16px; border-radius: 50%; background: var(--soft); color: var(--green); }
  .settings-detail { margin-top: 16px; padding-block: 12px; }
  .settings-detail summary { font-size: 16px; color: var(--ink); }
  .settings-detail .disclosure-body { padding-bottom: 12px; }
  .setup-note { font-size: 14px; background: var(--paper); padding: 16px; border-radius: 8px; overflow-wrap: anywhere; }
  .setup-note code { font-size: 13px; }
  .schedule { font-weight: 600; color: var(--green); }
  .sheet-link { display: inline-block; margin-top: 24px; min-height: 44px; padding-block: 8px; }
  .footnote { margin-top: 24px; }
  footer { color: var(--muted); text-align: center; font-size: 14px; margin-top: 48px; }
  .sr-only, .skip-link:not(:focus) { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  .skip-link:focus { display: block; padding: 12px; background: white; }

  .import-panel { margin-top: 16px; }
  .load-more { margin-top: 24px; }
  [data-slot="list-feedback"] { margin-bottom: 16px; }
  .danger { color: var(--red); }
  .danger-button { color: white; background: var(--red); border-color: var(--red); }
  .danger-button:hover { background: #75271f; }
  .delete-panel { margin-top: 20px; padding: 20px; border: 1px solid #e7c4ba; border-radius: 8px; background: #fff8f5; }
  .delete-panel .feedback { margin-top: 16px; }
  .reminder-shortcut { margin-top: 24px; text-align: left; }
  [data-slot="reminder-status"] { margin-bottom: 16px; }
  #schedule-title { padding-top: 8px; }

  @media (max-width: 600px) {
    .header-inner { padding: 20px 20px 0; gap: 16px 8px; }
    .brand { font-size: 18px; }
    .add-button { font-size: 14px; padding-inline: 12px; }
    main { padding: 32px 20px 24px; }
    .session-summary { padding-block: 18px; }
    .session-summary > div { padding-inline: 12px; }
    .session-summary strong { font-size: 22px; }
    .session-summary span { font-size: 14px; }
    .panel, .question-card { padding: 20px; }
    .question-heading { flex-direction: column; gap: 10px; }
    .question-actions > .push-right { margin-left: 0; }
    .question-actions { gap: 8px 4px; }
    .field-grid { grid-template-columns: 1fr; }
    .toolbar { grid-template-columns: 1fr; gap: 12px; }
    .rating-actions { flex-direction: column; }
    .rating-actions button { flex: auto; }
    .section-heading { align-items: flex-start; }
    .section-heading button { text-align: right; }
    .settings-detail { padding-block: 12px; }
    .empty { padding: 32px 20px; }
  }
</style>
